<template>
    <c-google-cloud-base-card title="File Versions" icon-name="utility:file" badge-text={badgeText}>
        <div class="version-list__body">
            <ul class="version-list__rows">
                <template for:each={allVersions} for:item="version">
                    <li key={version.id} class="version-list__row">
                        <c-google-cloud-base-entity
                            value={version.id}
                            title={version.name}
                            meta={version.fileName}
                            detail={version.warningMessage}
                            detail-variant={version.detailVariant}
                            leading-icon-name={version.iconName}
                            leading-icon-alternative-text={version.fileName}
                            trailing-primary={version.createdDateLabel}
                            trailing-secondary={version.sizeLabel}
                            onentityclick={handleVersionClick}
                        ></c-google-cloud-base-entity>
                    </li>
                </template>
            </ul>
            
            <lightning-spinner 
                lwc:if={isLoading}
                alternative-text="Loading"
                size="small">
            </lightning-spinner>
        </div>
        <c-google-cloud-file-preview
            lwc:ref="filePreviewModal"
            onnewversionupload={handleNewVersionUpload}
            onfilechange={handleFileEdit}
            onfiledeleted={handleFileDelete}
        ></c-google-cloud-file-preview>
    </c-google-cloud-base-card>
</template>
