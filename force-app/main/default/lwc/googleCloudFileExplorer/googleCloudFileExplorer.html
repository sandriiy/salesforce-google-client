<template>
    <div class="slds-page-header slds-page-header_record-home gcdc-file-explorer-header">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__body">
                        <div class="slds-page-header__name">
                            <div class="slds-page-header__name-title">
                                <span class="slds-page-header__title slds-truncate gcdc-file-explorer-section-label" title="Files">
                                    Files
                                </span>
                            </div>
                        </div>

                        <h1 class="slds-page-header__title slds-truncate gcdc-file-explorer-page-title" title={pageTitle}>
                            {pageTitle}
                        </h1>

                        <div class="slds-m-top_x-small gcdc-file-explorer-meta-line">
                            <template lwc:if={isBulkBarVisible}>
                                <c-google-cloud-bulk-action-bar
                                    selected-count={selection.count}
                                    total-count={bulkTotalCount}
                                    busy-label="Downloading"
                                    busy={isBulkDownloadInProgress}
                                    is-stopping={isBulkDownloadStopping}
                                    progress={bulkDownloadProgress}
                                    hide-actions
                                    onclearselection={handleSelectionClear}>
                                </c-google-cloud-bulk-action-bar>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-body_small">{metaLine}</p>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <div class="slds-page-header__col-actions">
                <div class="slds-page-header__controls gcdc-file-explorer-controls">
                    <template lwc:if={showHeaderSearch}>
                        <div class="slds-page-header__control gcdc-file-explorer-search">
                            <lightning-input
                                type="search"
                                variant="label-hidden"
                                placeholder="Search files..."
                                value={searchTerm}
                                onchange={handleSearch}
                                label="Search files">
                            </lightning-input>
                        </div>
                    </template>
                    <template lwc:if={isBulkDownloadInProgress}>
                        <div class="slds-page-header__control">
                            <lightning-button label="Stop" variant="neutral" icon-name="utility:stop" onclick={handleBulkDownloadStop} disabled={isBulkDownloadStopping}></lightning-button>
                        </div>
                    </template>
                    <template lwc:elseif={hasSelectedFiles}>
                        <div class="slds-page-header__control">
                            <lightning-button label={bulkDownloadLabel} variant="brand" icon-name="utility:download" onclick={handleBulkDownload}></lightning-button>
                        </div>
                    </template>
                    <div class="slds-page-header__control">
                        <lightning-button
                            label="Upload Files"
                            onclick={handleUploadClick}
                        ></lightning-button>
                    </div>
                    <div class="slds-page-header__control">
                        <lightning-button-icon
                            icon-name="utility:refresh"
                            variant="border-filled"
                            alternative-text="Refresh"
                            title="Refresh"
                            onclick={handleRefresh}
                            disabled={isLoading}>
                        </lightning-button-icon>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <input class="gcdc-file-explorer-file-input slds-hide" type="file" multiple onchange={handleFileSelected} onclick={handleFileInputReset}/>

    <div class="gcdc-file-explorer-container slds-p-around_none">
        <div class="gcdc-file-explorer-layout">
            <aside class="gcdc-file-explorer-left-nav slds-border_right" style="margin-top: -1rem;">
                <lightning-vertical-navigation selected-item={navSelectedItem} onselect={handleNavSelect}>
                    <lightning-vertical-navigation-section>
                        <template lwc:if={isPrivileged}>
                            <lightning-vertical-navigation-item
                                label="All Files"
                                name="all">
                            </lightning-vertical-navigation-item>
                        </template>
                        <template lwc:else>
                            <lightning-vertical-navigation-item
                                label="Owned by Me"
                                name="owned">
                            </lightning-vertical-navigation-item>
                            <lightning-vertical-navigation-item
                                label="Shared with Me"
                                name="shared">
                            </lightning-vertical-navigation-item>
                        </template>
                        <lightning-vertical-navigation-item
                            label="Search"
                            name="search">
                        </lightning-vertical-navigation-item>
                    </lightning-vertical-navigation-section>
                </lightning-vertical-navigation>
            </aside>

            <main class="gcdc-file-explorer-main-area">
                <template lwc:if={isSearchView}>
                    <c-google-cloud-file-search-filters
                        criteria={searchCriteria}
                        oncriteriachange={handleSearchCriteriaChange}>
                    </c-google-cloud-file-search-filters>
                </template>
                <template lwc:if={hasError}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-around_medium" role="alert">
                        <span class="slds-assistive-text">Error</span>
                        <h2>{errorMessage}</h2>
                    </div>
                </template>
                <template lwc:else>
                    <div class="gcdc-file-explorer-table-wrap">
                        <c-google-cloud-file-explorer-data-table
                            key-field="localId"
                            data={visibleRows}
                            columns={columns}
                            selected-rows={selectedRowIds}
                            onrowselection={handleRowSelection}
                            sorted-by={sortedBy}
                            sorted-direction={sortedDirection}
                            enable-infinite-loading={enableInfiniteLoading}
                            load-more-offset="200"
                            is-loading={isLoadingMore}
                            onloadmore={handleLoadMore}
                            onsort={handleSort}
                            ontitleclick={handleTitleClick}
                            onuserclick={handleUserClick}
                            class="gcdc-file-explorer-table"
                        ></c-google-cloud-file-explorer-data-table>

                        <template lwc:if={showEmptyState}>
                            <div class="gcdc-file-explorer-empty" role="status">
                                <lightning-icon class="gcdc-file-explorer-empty-icon" icon-name={emptyState.iconName} size="medium"></lightning-icon>
                                <h2 class="slds-text-heading_small">{emptyState.title}</h2>
                                <template lwc:if={emptyState.canClear}>
                                    <lightning-button class="slds-m-top_x-small" label="Clear all" onclick={handleSearchClear}></lightning-button>
                                </template>
                            </div>
                        </template>

                        <lightning-spinner lwc:if={isLoading} alternative-text="Loading files..." size="medium"></lightning-spinner>
                    </div>
                </template>
            </main>
        </div>
    </div>

    <c-google-cloud-file-preview
        lwc:ref="filePreviewModal"
        onnewversionrequest={handleNewVersionRequest}
        onfilechange={handleFileEdit}
        onfiledeleted={handleFileDelete}>
    </c-google-cloud-file-preview>
</template>
