<template>
    <div class="drive-config-shell">
        <div class="slds-grid slds-wrap slds-gutters_small">
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
                <section class="config-card">
                    <div class="config-padding">
                        <div class="config-step-bar">
                            <button class={authorizationStepClass} data-step="auth" onclick={handleStepClick} type="button">
                                <span class="step-indicator"></span>
                                <span class="step-label">Authorization</span>
                            </button>

                            <button class={locationsStepClass} data-step="locations" onclick={handleStepClick} type="button">
                                <span class="step-indicator"></span>
                                <span class="step-label">Folder Locations</span>
                            </button>

                            <button class={structureStepClass} data-step="structure" onclick={handleStepClick} type="button">
                                <span class="step-indicator"></span>
                                <span class="step-label">Folder Structure</span>
                            </button>
                        </div>

                        <template lwc:if={isAuthStep}>
                            <div class="slds-m-top_medium">
                                <lightning-radio-group
                                    name="authMode"
                                    label="Setup type"
                                    options={authModeOptions}
                                    value={authMode}
                                    type="radio"
                                    onchange={handleAuthModeChange}
                                ></lightning-radio-group>

                                <template lwc:if={isDeveloperMode}>
                                    <div class="slds-m-top_small">
                                        <lightning-input
                                            value={draft.customGoogleAuthorizerClass}
                                            onchange={handleTextChange}
                                            data-field="customGoogleAuthorizerClass"
                                            label="Custom Google Authorizer Class"
                                            field-level-help="Apex class name that implements GoogleAuthorizer and retrieves an access token."
                                            placeholder="e.g. MyGoogleAuthorizer"
                                            required
                                        ></lightning-input>
                                    </div>

                                    <div class="info-panel slds-m-top_small">
                                        <div class="info-title">Developer setup</div>
                                        <div class="info-text">Use this if you want full control and already have (or plan to build) a custom authorizer class.</div>
                                    </div>
                                </template>

                                <template lwc:if={isAdminMode}>
                                    <div class="config-two-column-grid slds-m-top_small">
                                        <lightning-input
                                            value={draft.customGoogleServiceAccount}
                                            onchange={handleTextChange}
                                            data-field="customGoogleServiceAccount"
                                            label="Service Account Email"
                                            field-level-help="Service account email from Google Cloud Console (ends with iam.gserviceaccount.com)."
                                            placeholder="e.g. drive-integration@my-project.iam.gserviceaccount.com"
                                            required
                                        ></lightning-input>

                                        <lightning-input
                                            value={draft.customGoogleCertificate}
                                            onchange={handleTextChange}
                                            data-field="customGoogleCertificate"
                                            label="Salesforce Certificate Name"
                                            field-level-help="Certificate uploaded in Setup → Certificate and Key Management."
                                            placeholder="e.g. GoogleDriveServiceAccount"
                                            required
                                        ></lightning-input>
                                    </div>

                                    <div class="info-panel slds-m-top_small">
                                        <div class="info-title">Admin setup</div>
                                        <div class="info-text">Use this option if you’d like to provide your integration details and have us set up the integration for you, no coding required.</div>
                                    </div>
                                </template>

                                <div class="slds-m-top_medium slds-grid slds-grid_align-end">
                                    <div class="action-buttons">
                                        <lightning-button
                                            variant="neutral"
                                            label="Revert changes"
                                            onclick={handleRevert}
                                            disabled={busy}
                                        ></lightning-button>

                                        <lightning-button
                                            class="slds-m-left_x-small"
                                            variant="brand"
                                            label={authPrimaryActionLabel}
                                            onclick={handleAuthPrimaryAction}
                                            disabled={busy}
                                        ></lightning-button>

                                        <template lwc:if={authorizationStepComplete}>
                                            <div class="slds-m-left_x-small">
                                                <lightning-button
                                                    variant="brand"
                                                    label="Next"
                                                    onclick={goToLocationsStep}
                                                    disabled={busy}>
                                                </lightning-button>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <template lwc:if={isLocationsStep}>
                            <div class="slds-m-top_medium">
                                <div class="upload-folder-card">
                                    <div class="upload-folder-header">
                                        <div class="upload-folder-title">
                                            Upload Folder Locations (IDs)
                                            <lightning-helptext content="Configure up to 10 Google Drive folder IDs in priority order. The first one is used by default. If it becomes full, uploads automatically fall over to the next one."></lightning-helptext>
                                        </div>
                                        <div class="upload-folder-count">{uploadFolderCountLabel}</div>
                                    </div>

                                    <div class="upload-folder-grid slds-m-top_small">
                                        <template for:each={uploadFolderRows} for:item="row">
                                            <div
                                                key={row.key}
                                                class={row.containerClass}
                                                data-index={row.index}
                                                draggable={row.draggable}
                                                ondragstart={handleUploadFolderDragStart}
                                                ondragover={handleUploadFolderDragOver}
                                                ondrop={handleUploadFolderDrop}
                                                ondragend={handleUploadFolderDragEnd}
                                            >
                                                <div class="upload-folder-title-row">
                                                    <div class="upload-folder-item-title">{row.title}</div>
                                                </div>

                                                <div class="upload-folder-input-row">
                                                    <lightning-input
                                                        data-role="upload-folder-input"
                                                        value={row.value}
                                                        data-index={row.index}
                                                        onchange={handleUploadFolderChange}
                                                        variant="label-hidden"
                                                        label={row.title}
                                                        placeholder={row.placeholder}
                                                        required={row.required}
                                                    ></lightning-input>

                                                    <template lwc:if={row.showControls}>
                                                        <div class="upload-folder-controls">
                                                            <lightning-button-icon
                                                                icon-name="utility:up"
                                                                variant="bare"
                                                                alternative-text="Move up"
                                                                title="Move up"
                                                                onclick={handleUploadFolderMoveUp}
                                                                data-index={row.index}
                                                                disabled={row.disableMoveUp}
                                                            ></lightning-button-icon>

                                                            <lightning-button-icon
                                                                icon-name="utility:down"
                                                                variant="bare"
                                                                alternative-text="Move down"
                                                                title="Move down"
                                                                onclick={handleUploadFolderMoveDown}
                                                                data-index={row.index}
                                                                disabled={row.disableMoveDown}
                                                            ></lightning-button-icon>

                                                            <lightning-button-icon
                                                                icon-name="utility:delete"
                                                                variant="bare"
                                                                alternative-text="Remove"
                                                                title="Remove"
                                                                onclick={handleUploadFolderRemove}
                                                                data-index={row.index}
                                                                style="margin-top: -2px;"
                                                            ></lightning-button-icon>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="slds-m-top_small slds-grid slds-grid_align-start">
                                        <lightning-button
                                            variant="neutral"
                                            icon-name="utility:add"
                                            label="Add folder location (ID)"
                                            onclick={handleUploadFolderAdd}
                                            disabled={addUploadFolderDisabled}
                                        ></lightning-button>
                                    </div>

                                    <div class="info-panel slds-m-top_small">
                                        <div class="info-title">Fallback behavior</div>
                                        <div class="info-text">Google Drive folders (especially shared drives) enforce hard limits on how many files they can hold. Once the primary folder cannot accept more uploads, the system automatically tries the next folder ID in the list, in order, until an upload succeeds. This lets you extend storage across multiple folders (or shared drives) without downtime.</div>
                                    </div>
                                </div>

                                <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                                    <lightning-button variant="neutral" label="Back" onclick={goToAuthStep} disabled={busy}></lightning-button>
                                    <lightning-button class="slds-m-left_x-small" variant="brand" label="Next" onclick={goToStructureStep} disabled={busy}></lightning-button>
                                    <lightning-button class="slds-m-left_x-small" variant="brand" label="Save" onclick={handleSave} disabled={busy}></lightning-button>
                                </div>
                            </div>
                        </template>

                        <template lwc:if={isStructureStep}>
                            <div class="slds-m-top_medium">
                                <div class="folder-structure-card">
                                    <div class="folder-structure-header">
                                        <div class="folder-structure-title">
                                            Folder Structure
                                            <lightning-helptext content="Build a subfolder structure under the primary upload folder. Enable User and/or Record, then reorder using drag-and-drop or the arrow controls. Leave both options disabled to upload files directly into the primary folder."></lightning-helptext>
                                        </div>
                                        <div class="folder-structure-preview">
                                            <span class="preview-label">Preview:</span>
                                            <span class="preview-path">{folderStructurePreview}</span>
                                        </div>
                                    </div>

                                    <div class="folder-structure-grid slds-m-top_small">
                                        <div class="folder-structure-item folder-structure-item-locked">
                                            <div class="structure-item-left">
                                                <div class="structure-item-title">Default upload folder</div>
                                                <div class="structure-item-subtitle">Required start point</div>
                                            </div>
                                            <div class="structure-item-right">
                                                <span class="structure-item-status">Always on</span>
                                            </div>
                                        </div>

                                        <template for:each={structureItems} for:item="item">
                                            <div
                                                key={item.key}
                                                class={item.containerClass}
                                                data-key={item.key}
                                                draggable={item.draggable}
                                                ondragstart={handleDragStart}
                                                ondragover={handleDragOver}
                                                ondrop={handleDrop}
                                                ondragend={handleDragEnd}
                                            >
                                                <div class="structure-item-left">
                                                    <div class="structure-item-title">{item.title}</div>
                                                    <div class="structure-item-subtitle">{item.subtitle}</div>
                                                </div>

                                                <div class="structure-item-right">
                                                    <lightning-input
                                                        class="structure-item-toggle"
                                                        type="toggle"
                                                        checked={item.enabled}
                                                        onchange={handleStructureToggle}
                                                        data-key={item.key}
                                                        label="Enabled"
                                                        variant="label-hidden"
                                                    ></lightning-input>

                                                    <div class="structure-item-reorder">
                                                        <lightning-button-icon
                                                            icon-name="utility:up"
                                                            variant="bare"
                                                            alternative-text="Move up"
                                                            title="Move up"
                                                            onclick={handleMoveUp}
                                                            data-key={item.key}
                                                            disabled={item.disableMoveUp}
                                                        ></lightning-button-icon>

                                                        <lightning-button-icon
                                                            icon-name="utility:down"
                                                            variant="bare"
                                                            alternative-text="Move down"
                                                            title="Move down"
                                                            onclick={handleMoveDown}
                                                            data-key={item.key}
                                                            disabled={item.disableMoveDown}
                                                        ></lightning-button-icon>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="info-panel slds-m-top_small">
                                        <div class="info-title">Usage</div>
                                        <div class="info-text">Enable <b>User</b> folder to create a folder for each user and <b>Record</b> folder to create a folder for each record. When both options are enabled, the order defines the folder hierarchy (e.g., Record → User or User → Record). See the <b>Preview</b> in the top-right corner.</div>
                                    </div>

                                    <template lwc:if={hasMultipleUploadFolders}>
                                        <div class="info-panel slds-m-top_small">
                                            <div class="info-title">Behavior with <b>multiple</b> upload folders</div>
                                            <div class="info-text">Because you configured multiple folder locations (IDs), this subfolder structure is created inside whichever folder actually accepts the upload (the primary folder by default, or a fallback folder when the primary is full). Each configured folder gets its own subtree.</div>
                                        </div>
                                    </template>
                                </div>

                                <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                                    <lightning-button variant="neutral" label="Back" onclick={goToLocationsStep} disabled={busy}></lightning-button>
                                    <lightning-button class="slds-m-left_x-small" variant="brand" label="Save" onclick={handleSave} disabled={busy}></lightning-button>
                                </div>
                            </div>
                        </template>
                    </div>
                </section>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <aside class="config-card config-quick-setup-right">
                    <div class="config-padding">
                        <div class="quick-setup-title">Quick Setup</div>

                        <template lwc:if={isAdminMode}>
                            <div class="quick-setup-step">
                                <div class="quick-setup-step-number">1</div>
                                <div>
                                    <div class="quick-setup-step-title">Generate certificate</div>
                                    <div class="quick-setup-step-text">Create a Service Account → Create a new Key → Convert it into a certificate.</div>
                                </div>
                            </div>
                            <div class="quick-setup-step">
                                <div class="quick-setup-step-number">2</div>
                                <div>
                                    <div class="quick-setup-step-title">Upload to Salesforce</div>
                                    <div class="quick-setup-step-text">Setup → Certificate and Key Management.</div>
                                </div>
                            </div>
                            <div class="quick-setup-step">
                                <div class="quick-setup-step-number">3</div>
                                <div>
                                    <div class="quick-setup-step-title">Enter details</div>
                                    <div class="quick-setup-step-text">Specify the Service Account email &amp; uploaded certificate name.</div>
                                </div>
                            </div>
                        </template>

                        <template lwc:if={isDeveloperMode}>
                            <div class="quick-setup-step">
                                <div class="quick-setup-step-number">1</div>
                                <div>
                                    <div class="quick-setup-step-title">Generate certificate</div>
                                    <div class="quick-setup-step-text">Create a Service Account → Create a new Key → Convert it into a certificate.</div>
                                </div>
                            </div>
                            <div class="quick-setup-step">
                                <div class="quick-setup-step-number">2</div>
                                <div>
                                    <div class="quick-setup-step-title">Upload to Salesforce</div>
                                    <div class="quick-setup-step-text">Setup → Certificate and Key Management.</div>
                                </div>
                            </div>
                            <div class="quick-setup-step">
                                <div class="quick-setup-step-number">3</div>
                                <div>
                                    <div class="quick-setup-step-title">Implement authorizer</div>
                                    <div class="quick-setup-step-text">Create an Apex class that implements <b>GoogleAuthorizer</b> and returns an access token.</div>
                                </div>
                            </div>
                        </template>

                        <div class="content-divider"></div>

                        <div class="quick-setup-button-row">
                            <lightning-button
                                variant="neutral"
                                label="Open Quick Setup Guide"
                                onclick={openQuickSetupGuide}
                            ></lightning-button>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </div>
</template>
