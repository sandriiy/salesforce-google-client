site_name: Google Client for Salesforce
site_url: https://sandriiy.github.io/salesforce-google-client/
repo_url: https://github.com/sandriiy/salesforce-google-client
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo/logo_no_background.png

  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Overview:
      - Home: index.md
      - Prerequisites: prerequisites.md
      - Architecture: architecture.md
      - Quality Assurance:
        - Validation Log: validation/release-validation-log.md
        - Validation Suites: validation/validation-suites.md

  - Setup:
      - Install: setup/install-and-dependencies.md
      - Set Up Service Account: setup/setup-service-account.md
      - Configure Certificate: setup/configure-certificate.md
      - Configure Google Workspace: setup/configure-drive.md
      - Configure AI & Intelligence: setup/configure-intelligence.md
      - Permissions: setup/permissions.md

  - Usage:
      - Add Components (Core Clouds): usage/core-clouds.md
      - Add Components (Experience Cloud): usage/experience-cloud.md

  - Features:
      - File Explorer: features/file-explorer.md
      - Preview: features/preview.md
      - Sharing: features/sharing.md
      - Folder Structure: features/folder-structure.md
      - Public Links: features/public-links.md
      - Versioning: features/versioning.md
      - Audit & Logging: features/audit.md
      - Flows & Automation:
          - Uploader in Screen Flows: features/flows-automation/uploader-screen-flows.md
      - Artificial Intelligence:
          - Overview: features/artificial-intelligence/overview.md

  - Media:
      - Videos: media/videos.md
      - Articles: media/articles.md

  - Security: security.md

  - Help:
      - Known Issues & Fixes: help/known-issues.md
      - FAQ: help/faq.md
