<template>
    <div class="drive-config-shell">
        <div class="slds-grid slds-wrap slds-gutters_small">
            <div class="slds-col slds-size_1-of-1">
                <section class="config-card">
                    <div class="config-padding">
                        <div class="config-step-bar provider-switch-bar">
                            <button class={geminiOptionClass} data-provider="gemini" onclick={handleProviderChange} type="button">
                                <span class="step-indicator"></span>
                                <span class="provider-option-content">
                                    <span class="step-label">Gemini Developer API</span>
                                    <span class="provider-option-description">Fast setup for developer workflows</span>
                                </span>
                            </button>

                            <button class={agentOptionClass} data-provider="agent" onclick={handleProviderChange} type="button">
                                <span class="step-indicator"></span>
                                <span class="provider-option-content">
                                    <span class="step-label">Agent Platform</span>
                                    <span class="provider-option-description">Production-ready setup for core use cases</span>
                                </span>
                            </button>
                        </div>

                        <template lwc:if={isGeminiMode}>
                            <div class="recommendation-panel recommendation-panel-gemini slds-m-top_small">
                                <div class="recommendation-title">Recommendation</div>
                                <div class="recommendation-text">Use Gemini Developer API mainly for developer use, internal experimentation, and lighter non-production scenarios. For production and UAT, Agent Platform (ex-Vertex AI) is the preferred setup.</div>
                            </div>

                            <div class="config-two-column-grid slds-m-top_small">
                                <lightning-input
                                    type="text"
                                    value={draft.customGeminiApiKey}
                                    onchange={handleTextChange}
                                    data-field="customGeminiApiKey"
                                    label="Gemini API Key"
                                    field-level-help="API key created in Google AI Studio and used to authenticate requests to the Gemini Developer API."
                                    placeholder="Paste your Gemini API key"
                                    required
                                ></lightning-input>

                                <lightning-input
                                    type="text"
                                    value={draft.customModelName}
                                    onchange={handleTextChange}
                                    data-field="customModelName"
                                    label="Model Name"
                                    field-level-help="Gemini model name used for requests, for example gemini-3.8-flash."
                                    placeholder="e.g. gemini-3.8-flash"
                                    required
                                ></lightning-input>
                            </div>
                        </template>

                        <template lwc:if={isAgentMode}>
                            <div class="recommendation-panel recommendation-panel-agent slds-m-top_small">
                                <div class="recommendation-title">Recommendation</div>
                                <div class="recommendation-text">Use Agent Platform (ex-Vertex AI) for production and UAT environments. It is a stronger enterprise fit for Google Client for Salesforce and enables enterprise-grade automation.</div>
                            </div>

                            <div class="config-two-column-grid slds-m-top_small">
                                <lightning-input
                                    type="text"
                                    value={draft.customAgentProjectId}
                                    onchange={handleTextChange}
                                    data-field="customAgentProjectId"
                                    label="Agent Project ID"
                                    field-level-help="Google Cloud Project ID that contains your Agent Platform (ex-Vertex AI) configuration."
                                    placeholder="e.g. my-google-cloud-project"
                                    required
                                ></lightning-input>

                                <lightning-input
                                    type="text"
                                    value={draft.customAgentLocation}
                                    onchange={handleTextChange}
                                    data-field="customAgentLocation"
                                    label="Agent Location"
                                    field-level-help="Agent Platform (ex-Vertex AI) location or region where requests will be sent, for example global or us-central1."
                                    placeholder="e.g. global"
                                    required
                                ></lightning-input>

                                <lightning-input
                                    type="text"
                                    value={draft.customModelName}
                                    onchange={handleTextChange}
                                    data-field="customModelName"
                                    label="Model Name"
                                    field-level-help="Gemini model name used for Agent Platform (ex-Vertex AI) requests, for example gemini-3.8-flash."
                                    placeholder="e.g. gemini-3.8-flash"
                                    required
                                ></lightning-input>
                            </div>
                        </template>

                        <div class="slds-m-top_medium slds-grid slds-grid_align-end">
                            <div class="action-buttons action-buttons-wrap">
                                <lightning-button
                                    variant="neutral"
                                    label="Revert changes"
                                    onclick={handleRevert}
                                    disabled={busy}
                                ></lightning-button>

                                <lightning-button
                                    class="slds-m-left_x-small"
                                    variant="brand"
                                    label={primaryActionLabel}
                                    onclick={handlePrimaryAction}
                                    disabled={busy}
                                ></lightning-button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>
</template>
