<template>
    <div class="client-shell">
        <div class="client-frame">
            <section class="client-header">
                <div class="slds-grid slds-grid_vertical-align-center slds-gutters_small">
                    <div class="slds-col slds-grow-none">
                        <div class="client-badge">
                            <lightning-icon icon-name="standard:settings" size="small"></lightning-icon>
                        </div>
                    </div>

                    <div class="slds-col slds-truncate client-header-title-wrap">
                        <h1 class="client-header-title slds-truncate">Google Integration Settings</h1>
                    </div>

                    <div class="slds-col slds-grow-none">
                        <div class="header-actions">
                            <div class="view-switch" role="tablist" aria-label="Configuration area">
                                <button type="button" class={setupViewClass} role="tab" aria-selected={isMainView} title="Connect Google Drive and your AI provider" onclick={handleSetupViewClick}>
                                    <lightning-icon icon-name="utility:setup_assistant_guide" size="x-small"></lightning-icon>
                                    <span class="action-label">Setup</span>
                                </button>
                                <button type="button" class={advancedViewClass} role="tab" aria-selected={isAdvancedView} title="Previews, uploads, File Explorer columns, AI analysis and labeling, prompt safety" onclick={handleAdvancedViewClick}>
                                    <lightning-icon icon-name="utility:settings" size="x-small"></lightning-icon>
                                    <span class="action-label">Advanced</span>
                                </button>
                            </div>

                            <button type="button" class="action-button action-button-neutral" onclick={handleRevert} disabled={revertDisabled}>
                                <lightning-icon icon-name="utility:undo" size="x-small"></lightning-icon>
                                <span class="action-label">Revert</span>
                            </button>

                            <button type="button" class="action-button action-button-outline" onclick={handleSaveValidate} disabled={saveDisabled}>
                                <span class="action-label">Save</span>
                            </button>
                        </div>
                    </div>
                </div>

                <template lwc:if={isMainView}>
                    <div class="config-selector-row slds-m-top_medium">
                        <div class="config-selector" data-role="selectorRoot">
                            <button type="button" class="config-selected-tile" onclick={toggleConfigMenu} aria-expanded={isConfigMenuOpen}>
                                <span class="config-tile-icon">
                                    <lightning-icon icon-name={selectedConfig.icon} size="small"></lightning-icon>
                                </span>

                                <span class="config-tile-text">
                                    <span class="config-tile-title">{selectedConfig.label}</span>
                                    <span class="config-tile-desc">{selectedConfig.description}</span>
                                </span>

                                <span class="config-tile-caret">
                                    <lightning-icon icon-name="utility:chevrondown" size="x-small"></lightning-icon>
                                </span>
                            </button>

                            <div class={menuClass} role="menu">
                                <template for:each={configMenuItems} for:item="item">
                                    <button key={item.key} type="button" class={item.className} role="menuitemradio" aria-checked={item.isSelected} data-key={item.key} onclick={handleSelectConfig}>
                                        <span class="config-menu-icon">
                                            <lightning-icon icon-name={item.icon} size="small"></lightning-icon>
                                        </span>
                                        <span class="config-menu-text">
                                            <span class="config-menu-title">{item.label}</span>
                                            <span class="config-menu-desc">{item.description}</span>
                                        </span>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </section>

            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <div class="main-container">
                <template lwc:if={hasError}>
                    <section class="panel-card error-panel">
                        <div class="panel-padding">
                            <div class="error-title">Something went wrong</div>
                            <div class="error-message">{errorMessage}</div>
                        </div>
                    </section>
                </template>
                <template lwc:else>
                    <template lwc:if={isAdvancedView}>
                        <div class="advanced-container">
                            <section class="panel-card">
                                <div class="panel-padding">
                                    <div class="advanced-step-bar">
                                        <template for:each={advancedTabs} for:item="tab">
                                            <button key={tab.key} class={tab.className} data-step={tab.key} onclick={handleAdvancedStepClick} type="button">
                                                <span class="step-indicator"></span>
                                                <span class="step-copy">
                                                    <span class="step-label">{tab.label}</span>
                                                </span>
                                            </button>
                                        </template>
                                    </div>

                                    <div class={fileManagementPanelClass} data-tab="fileManagement">
                                        <div class="tab-toggle-header">
                                            <div class="tab-toggle-copy">
                                                <div class="tab-toggle-title">File Preview</div>
                                                <div class="tab-toggle-subtitle">Skip generating preview documents and hide any previews that already exist.</div>
                                            </div>
                                            <div class="tab-toggle-control">
                                                <lightning-input
                                                    type="toggle"
                                                    variant="label-hidden"
                                                    checked={draft.isFilePreviewDisabled}
                                                    onchange={handleToggle}
                                                    data-field="isFilePreviewDisabled"
                                                    label="Disable File Preview"
                                                    message-toggle-active=""
                                                    message-toggle-inactive="">
                                                </lightning-input>
                                            </div>
                                        </div>

                                        <div class="tab-toggle-header slds-m-top_medium">
                                            <div class="tab-toggle-copy">
                                                <div class="tab-toggle-title">Direct Browser Upload</div>
                                                <div class="tab-toggle-subtitle">Send large files straight from the browser to Google Drive instead of routing every chunk through Salesforce. Uploads are noticeably faster, and anything that cannot be sent directly falls back to the standard upload.</div>

                                                <template lwc:if={isDirectUploadSaved}>
                                                    <div class="tab-toggle-probe">
                                                        <lightning-button
                                                            label="Test connection"
                                                            variant="neutral"
                                                            onclick={handleDirectUploadProbe}
                                                            disabled={isDirectUploadProbeRunning}>
                                                        </lightning-button>
                                                        <span lwc:if={directUploadProbeMessage} class={directUploadProbeClass}>{directUploadProbeMessage}</span>
                                                    </div>
                                                </template>
                                            </div>
                                            <div class="tab-toggle-control">
                                                <lightning-input
                                                    type="toggle"
                                                    variant="label-hidden"
                                                    checked={draft.isDirectBrowserUploadEnabled}
                                                    onchange={handleToggle}
                                                    data-field="isDirectBrowserUploadEnabled"
                                                    label="Enable Direct Browser Upload"
                                                    message-toggle-active=""
                                                    message-toggle-inactive="">
                                                </lightning-input>
                                            </div>
                                        </div>

                                        <div class="tab-toggle-header slds-m-top_medium">
                                            <div class="tab-toggle-copy">
                                                <div class="tab-toggle-title">Open in Google Drive</div>
                                                <div class="tab-toggle-subtitle">Lets file owners open a file directly in Google Drive. They get view access to that one file for a limited time, so they can read, print, download, or make their own copy. They cannot change or delete it, and the rest of the folder stays private.</div>
                                            </div>
                                            <div class="tab-toggle-control">
                                                <lightning-input
                                                    type="toggle"
                                                    variant="label-hidden"
                                                    checked={draft.isOpenInDriveEnabled}
                                                    onchange={handleToggle}
                                                    data-field="isOpenInDriveEnabled"
                                                    label="Enable Open in Google Drive"
                                                    message-toggle-active=""
                                                    message-toggle-inactive="">
                                                </lightning-input>
                                            </div>
                                        </div>

                                        <div class="slds-grid slds-wrap slds-gutters_small slds-m-top_medium">
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                                <lightning-input
                                                    type="number"
                                                    value={draft.defaultBigFileSize}
                                                    onchange={handleChangeNumber}
                                                    data-field="defaultBigFileSize"
                                                    label="Maximum Preview File Size"
                                                    field-level-help="Specifies the maximum file size, in bytes, allowed for preview generation. This setting does not apply to PDF files, as they can be previewed regardless of size. Setting this value too high may result in a heap size limit exception. The default value is 2,097,152 bytes (2 MB)."
                                                    placeholder="e.g. 5000000">
                                                </lightning-input>
                                            </div>

                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                                <lightning-input
                                                    type="number"
                                                    value={draft.maxDeleteChainSize}
                                                    onchange={handleChangeNumber}
                                                    data-field="maxDeleteChainSize"
                                                    label="Max Delete Chain Size"
                                                    field-level-help="How many files are deleted per queueable job before chaining another job."
                                                    placeholder="e.g. 50"
                                                    required>
                                                </lightning-input>
                                            </div>

                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                                <lightning-input
                                                    type="text"
                                                    max-length="255"
                                                    value={draft.organizationalDomain}
                                                    onchange={handleChangeText}
                                                    data-field="organizationalDomain"
                                                    label="Organizational Domain"
                                                    field-level-help="Specify your organization’s domain (for example, “cloudrylabs.com”). If set, all public links and shares created for outside Salesforce will be restricted to this domain, unless the user specifies otherwise."
                                                    placeholder="e.g. cloudrylabs.com">
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </div>

                                    <div class={userInterfacePanelClass} data-tab="userInterface">
                                        <div class="ui-section">
                                            <div class="ui-section-header">
                                                <div class="ui-section-title">File Explorer tab</div>
                                                <div class="ui-section-subtitle">This section lets you configure the File Explorer tab, including which columns appear in the datatable.</div>
                                            </div>

                                            <div class="ui-section-body">
                                                <div class="ui-columns-row">
                                                    <div class="safety-field-col">
                                                        <lightning-dual-listbox
                                                            name="fileExplorerColumns"
                                                            label="Datatable Columns"
                                                            source-label="Available Columns"
                                                            selected-label="Displayed Columns"
                                                            field-level-help="Choose which columns appear in the datatable. The `Title` column is always displayed first, and up to 7 columns are supported."
                                                            options={fileExplorerColumnOptions}
                                                            value={selectedFileExplorerColumns}
                                                            required-options={requiredFileExplorerColumns}
                                                            max={maxFileExplorerColumns}
                                                            message-when-range-overflow={fileExplorerColumnsOverflowMessage}
                                                            onchange={handleColumnsChange}
                                                            enable-reorder>
                                                        </lightning-dual-listbox>
                                                    </div>
                                                    <div class="safety-info-col">
                                                        <div class="info-panel">
                                                            <div class="info-title">Add a custom field</div>
                                                            <div class="info-text">
                                                                <p>
                                                                    You can add custom fields from the Google File Version object to the File Explorer datatable, making additional file information visible to your users.
                                                                    <br><br>
                                                                    Enter the field’s exact API name, for example: My_Custom_Field__c
                                                                    <br><br>
                                                                    API names are not validated when the configuration is saved. If a field does not exist or cannot be accessed, its column will remain empty in the datatable.
                                                                </p>
                                                            </div>
                                                            <div class="slds-grid slds-grid_vertical-align-end slds-gutters_x-small slds-m-top_small">
                                                                <div class="slds-col slds-grow">
                                                                    <lightning-input
                                                                        type="text"
                                                                        max-length="80"
                                                                        variant="label-hidden"
                                                                        value={customColumnDraft}
                                                                        onchange={handleCustomColumnDraftChange}
                                                                        label="Custom field API name"
                                                                        placeholder="e.g. My_Custom_Field__c">
                                                                    </lightning-input>
                                                                </div>
                                                                <div class="slds-col slds-no-flex">
                                                                    <lightning-button
                                                                        variant="brand"
                                                                        label="Add column"
                                                                        title="Add custom field column"
                                                                        onclick={handleAddCustomColumn}>
                                                                    </lightning-button>
                                                                </div>
                                                            </div>
                                                            <div class="slds-grid slds-grid_vertical-align-end info-link" style="height: 100%;">
                                                                <a href={uiFileExplorerUrl} target="_blank" rel="noopener noreferrer">Learn about File Explorer →</a>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class={aiIntelligencePanelClass} data-tab="aiIntelligence">
                                        <div class="ui-section">
                                            <div class="ui-section-header ui-section-header-with-control">
                                                <div class="ui-section-copy">
                                                    <div class="ui-section-title">AI Analytics</div>
                                                    <div class="ui-section-subtitle">Generate summaries and answer questions about Google Drive files using Gemini or Agent Platform.</div>
                                                </div>
                                                <div class="tab-toggle-control">
                                                    <lightning-input
                                                        type="toggle"
                                                        variant="label-hidden"
                                                        checked={draft.isFileIntelligenceEnabled}
                                                        disabled={isIntelligenceToggleDisabled}
                                                        onchange={handleIntelligenceToggle}
                                                        data-field="isFileIntelligenceEnabled"
                                                        label="Enable AI Analytics"
                                                        message-toggle-active=""
                                                        message-toggle-inactive="">
                                                    </lightning-input>
                                                </div>
                                            </div>

                                            <div class="ui-section-body">
                                                <template lwc:if={showProviderRequiredHint}>
                                                    <div class="section-hint">
                                                        <lightning-icon icon-name="utility:info" size="x-small" class="section-hint-icon"></lightning-icon>
                                                        <span>
                                                            No AI provider is connected yet. Specify and validate Gemini or Agent Platform, then come back to turn analysis on. <button type="button" class="section-hint-link" onclick={handleOpenProviderSetup}>Open Gemini &amp; Agent Platform</button>
                                                        </span>
                                                    </div>
                                                </template>

                                                <div class="slds-grid slds-wrap slds-gutters_small">
                                                    <div class="slds-col slds-size_1-of-1">
                                                        <lightning-textarea
                                                            value={draft.customSummaryPrompt}
                                                            onchange={handleChangeText}
                                                            data-field="customSummaryPrompt"
                                                            label="Summary Prompt"
                                                            field-level-help="System prompt used when Google Client generates a file summary."
                                                            max-length="32768"
                                                            disabled={isIntelligenceDisabled}
                                                            required={isIntelligenceEnabled}
                                                        ></lightning-textarea>
                                                    </div>

                                                    <div class="slds-col slds-size_1-of-1">
                                                        <lightning-textarea
                                                            value={draft.customQuestionPrompt}
                                                            onchange={handleChangeText}
                                                            data-field="customQuestionPrompt"
                                                            label="Question Prompt"
                                                            field-level-help="System prompt used when Google Client answers questions about a file."
                                                            max-length="32768"
                                                            disabled={isIntelligenceDisabled}
                                                            required={isIntelligenceEnabled}
                                                        ></lightning-textarea>
                                                    </div>

                                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                                        <lightning-input
                                                            type="number"
                                                            value={draft.questionMaxOutputTokens}
                                                            onchange={handleChangeNumber}
                                                            data-field="questionMaxOutputTokens"
                                                            label="Question Max Output Tokens"
                                                            field-level-help="Maximum number of tokens returned for document question responses."
                                                            placeholder="e.g. 1024"
                                                            disabled={isIntelligenceDisabled}
                                                            required={isIntelligenceEnabled}
                                                        ></lightning-input>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="ui-section slds-m-top_medium">
                                            <div class="ui-section-header ui-section-header-with-control">
                                                <div class="ui-section-copy">
                                                    <div class="ui-section-title">AI Labeling</div>
                                                    <div class="ui-section-subtitle">Assign one of your Google Drive labels to each new file based on what it contains. Files the AI is not sure about stay unlabeled. Works on top of AI Analytics.</div>
                                                </div>
                                                <div class="tab-toggle-control">
                                                    <lightning-input
                                                        type="toggle"
                                                        variant="label-hidden"
                                                        checked={isLabelingEnabled}
                                                        disabled={isLabelingToggleDisabled}
                                                        onchange={handleLabelingToggle}
                                                        data-field="isAiLabelingEnabled"
                                                        label="Enable AI Labeling"
                                                        message-toggle-active=""
                                                        message-toggle-inactive="">
                                                    </lightning-input>
                                                </div>
                                            </div>

                                            <div class="ui-section-body">
                                                <template lwc:if={isIntelligenceDisabled}>
                                                    <div class="section-hint">
                                                        <lightning-icon icon-name="utility:info" size="x-small" class="section-hint-icon"></lightning-icon>
                                                        <span>Turn on AI Analytics above to make labeling available.</span>
                                                    </div>
                                                </template>

                                                <div class="slds-grid slds-wrap slds-gutters_small">
                                                    <div class="slds-col slds-size_1-of-1">
                                                        <lightning-textarea
                                                            value={draft.customLabelingPrompt}
                                                            onchange={handleChangeText}
                                                            data-field="customLabelingPrompt"
                                                            label="Labeling Prompt"
                                                            field-level-help="System prompt used when Google Client decides which label, if any, describes a file. The label descriptions below are added to it automatically."
                                                            max-length="32768"
                                                            disabled={isLabelingDisabled}
                                                            required={isLabelingEnabled}
                                                        ></lightning-textarea>
                                                    </div>

                                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                                        <lightning-input
                                                            type="number"
                                                            value={draft.aiLabelingMinConfidence}
                                                            onchange={handleChangeNumber}
                                                            data-field="aiLabelingMinConfidence"
                                                            label="Minimum Confidence (%)"
                                                            field-level-help="How sure the AI must be before a label is applied, from 0 to 100. A file below this confidence stays unlabeled. 80 is a good starting point; raise it if labels are applied too eagerly, lower it if too few files get labeled."
                                                            placeholder="e.g. 80"
                                                            min={minConfidencePercent}
                                                            max={maxConfidencePercent}
                                                            step="1"
                                                            disabled={isLabelingDisabled}
                                                            required={isLabelingEnabled}
                                                        ></lightning-input>
                                                    </div>

                                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                                        <lightning-input
                                                            type="number"
                                                            value={draft.aiLabelingThinkingBudget}
                                                            onchange={handleChangeNumber}
                                                            data-field="aiLabelingThinkingBudget"
                                                            label="Thinking Budget (tokens)"
                                                            field-level-help="How much room the AI gets to reason before choosing a label. 1024 is the default and suits models that keep reasoning whatever they are told, which otherwise answer with nothing. 0 turns reasoning off, which is faster and cheaper where the model allows it. Only models that support thinking use this."
                                                            placeholder="e.g. 0"
                                                            min="0"
                                                            step="1"
                                                            disabled={isLabelingDisabled}
                                                            required={isLabelingEnabled}
                                                        ></lightning-input>
                                                    </div>

                                                    <div class="slds-col slds-size_1-of-1 slds-m-top_small">
                                                        <c-google-cloud-ai-label-editor
                                                            value={draft.aiLabelDefinitions}
                                                            disabled={isLabelingDisabled}
                                                            max-labels={maxAiLabelDefinitions}
                                                            ondefinitionschange={handleLabelDefinitionsChange}>
                                                        </c-google-cloud-ai-label-editor>
                                                    </div>

                                                    <div class="slds-col slds-size_1-of-1">
                                                        <div class="info-link">
                                                            <a href={aiLabelingGuideUrl} target="_blank" rel="noopener noreferrer">Learn about AI Labeling →</a>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class={safetyCustomizationPanelClass} data-tab="safetyCustomization">
                                        <div class="safety-row">
                                            <div class="safety-field-col">
                                                <lightning-combobox
                                                    value={effectiveAiSafetyMode}
                                                    onchange={handleChangeText}
                                                    data-field="aiSafetyMode"
                                                    options={aiSafetyModeOptions}
                                                    label="AI Safety Mode"
                                                    field-level-help="Controls how strictly the AI prompt safety guard evaluates user questions and AI responses. Standard is recommended for most orgs."
                                                    disabled={isIntelligenceDisabled}
                                                ></lightning-combobox>
                                            </div>
                                            <div class="safety-info-col">
                                                <div class="info-panel">
                                                    <div class="info-title">How safety modes work</div>
                                                    <div class="info-text">Strict blocks the most aggressive prompts and responses, Standard is the recommended baseline for production, Relaxed allows broader questions with light filtering, and Off skips the guard entirely and forwards raw prompts to the model.</div>
                                                    <div class="info-link">
                                                        <a href={safetyModeGuideUrl} target="_blank" rel="noopener noreferrer">Read the AI safety guide →</a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="safety-row">
                                            <div class="safety-field-col">
                                                <lightning-input
                                                    type="text"
                                                    max-length="60"
                                                    value={draft.customAiPromptSafetyGuardClass}
                                                    onchange={handleChangeText}
                                                    data-field="customAiPromptSafetyGuardClass"
                                                    label="Custom AI Prompt Safety Guard Class"
                                                    field-level-help="Optional. The name of your Apex class implementing IGoogleAiPromptSafetyGuard. Leave blank to use the built-in default guard."
                                                    placeholder="e.g. MyCustomAiPromptSafetyGuard"
                                                    disabled={isIntelligenceDisabled}
                                                ></lightning-input>
                                            </div>
                                            <div class="safety-info-col">
                                                <div class="info-panel">
                                                    <div class="info-title">Bring your own safety guard</div>
                                                    <div class="info-text">Implement the IGoogleAiPromptSafetyGuard Apex interface with your own inspection rules, then enter the class name here. Leave blank to keep the built-in default guard that uses the AI Safety Mode setting on the left.</div>
                                                    <div class="info-link">
                                                        <a href={customGuardGuideUrl} target="_blank" rel="noopener noreferrer">Read the custom guard guide →</a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </template>
                    <template lwc:else>
                        <section class="main-area">
                            <lwc:component
                                lwc:is={configComponentConstructor}
                                lwc:ref="configComponent"
                                draft={draft}
                                server={server}
                                busy={busy}
                                is-loading={isLoading}
                                onfieldchange={handleFieldChange}
                                oncontextchange={handleSectionContextChange}
                                onsave={handleSave}
                                onsavevalidate={handleSaveValidate}
                                onvalidate={handleValidate}
                                onrevert={handleRevert}
                                ondeactivate={handleDeactivateRequest}
                                onsteperror={handleStepError}
                                onvaliditychange={handleValidityChange}>
                            </lwc:component>
                        </section>
                    </template>
                </template>
            </div>
        </div>
    </div>

    <template lwc:if={visibleNotice}>
        <div class="config-notice" role="status" aria-live="polite">
            <div class="config-notice-icon">
                <lightning-icon icon-name="utility:info_alt" size="small" variant="warning" alternative-text="Heads up"></lightning-icon>
            </div>
            <div class="config-notice-body">
                <div class="config-notice-eyebrow">Heads up</div>
                <div class="config-notice-title">{visibleNotice.title}</div>
                <div class="config-notice-text">{visibleNotice.text}</div>
                <button type="button" class="config-notice-action" onclick={handleNoticeAction}>{visibleNotice.actionLabel} →</button>
            </div>
            <div class="config-notice-close">
                <lightning-button-icon icon-name="utility:close" variant="bare" size="small" alternative-text="Dismiss" title="Dismiss" onclick={handleNoticeDismiss}></lightning-button-icon>
            </div>
        </div>
    </template>

    <template lwc:if={showUnsavedChangesModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="unsaved-changes-title" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h1 id="unsaved-changes-title" class="slds-modal__title slds-hyphenate">Unsaved changes</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>You have changes that have not been saved yet. Save them before opening {pendingNavigationLabel}, or discard them to continue with the last saved configuration.</p>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Keep editing" onclick={handleNavigationCancel} disabled={busy}></lightning-button>
                    <lightning-button class="slds-m-left_x-small" label="Discard changes" onclick={handleNavigationDiscard} disabled={busy}></lightning-button>
                    <lightning-button class="slds-m-left_x-small" variant="brand" label="Save and continue" onclick={handleNavigationSave} disabled={busy}></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template lwc:if={isDeactivateAiModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="deactivate-ai-title" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h1 id="deactivate-ai-title" class="slds-modal__title slds-hyphenate">{deactivateAiModalTitle}</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>AI Analytics and AI Labeling will be turned off for everyone, and the provider details, prompts, label definitions and safety settings will be cleared. Summaries and labels already stored on files are kept.</p>
                    <p class="slds-m-top_small">You can connect a provider and turn AI back on at any time.</p>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Keep AI" onclick={handleDeactivateCancel} disabled={busy}></lightning-button>
                    <lightning-button class="slds-m-left_x-small" variant="destructive" label="Deactivate" onclick={handleDeactivateConfirm} disabled={busy}></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
