<template>
    <section class="slds-card container" aria-label="Support Information">
        <div class="slds-card__body slds-p-horizontal_medium">
            <lightning-accordion
                allow-multiple-sections-open
                active-section-name={activeSections}
                onsectiontoggle={handleSectionToggle}
            >
                <template lwc:if={showGuide}>
                    <lightning-accordion-section name="guide" label={guide.title}>
                        <div class="sectionBody">
                            <template for:each={guide.steps} for:item="step">
                                <div key={step.key} class="guide-step">
                                    <div class="guide-step-number">{step.number}</div>
                                    <div class="guide-step-copy">
                                        <div class="guide-step-title">{step.title}</div>
                                        <lightning-formatted-rich-text class="guide-step-text" value={step.text}></lightning-formatted-rich-text>
                                    </div>
                                </div>
                            </template>

                            <div class="guide-button-row">
                                <lightning-button variant="neutral" label={guide.button.label} onclick={handleOpenGuideLink}></lightning-button>
                            </div>
                        </div>
                    </lightning-accordion-section>
                </template>

                <lightning-accordion-section name="community" label="Community Support">
                    <div class="sectionBody slds-m-bottom_small">
                        <p class="slds-text-body_regular slds-m-bottom_small">
                            Google Client is an open-source UI client for Salesforce to
                            operate on Google Drive files. It is released under the MIT
                            License.
                        </p>

                        <p class="slds-text-body_regular slds-m-bottom_small">
                            If you run into an issue or want to propose an enhancement, open a
                            GitHub issue. Requests may be reviewed and addressed by the
                            community as time permits, but fixes and timelines are not
                            guaranteed.
                        </p>

                        <div class="linkRow">
                            <a
                                class="slds-text-link"
                                href={githubUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                Open GitHub Repository
                            </a>
                        </div>
                    </div>

                    <div class="callout slds-m-top_medium">
                        <lightning-formatted-rich-text
                            value={contactHtml}
                        ></lightning-formatted-rich-text>
                    </div>
                </lightning-accordion-section>
            </lightning-accordion>
        </div>
    </section>
</template>
